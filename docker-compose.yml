# Pornește tot sistemul cu o singură comandă:   docker compose up --build
#
#   Aplicația   → http://localhost:8000
#   Mailpit     → http://localhost:8025   (emailurile trimise de aplicație)
#   scheduler   → job-urile periodice (cursuri BNR, notificări), fără pagină web
#
# Setările de aici sunt pentru rulare LOCALĂ / demonstrație, nu pentru producție.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aprovizionare
      POSTGRES_USER: aprovizionare
      POSTGRES_PASSWORD: aprovizionare
    ports:
      # Baza e accesibilă și din afara Docker (pentru `runserver` și `pytest` pe calculatorul
      # dezvoltatorului), dar doar de pe calculatorul local (127.0.0.1), nu din rețea.
      # 5433, nu 5432: portul standard poate fi ocupat de un PostgreSQL instalat separat.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # datele rămân după oprirea containerului
    healthcheck:  # „e gata baza de date să primească conexiuni?”
      test: ["CMD-SHELL", "pg_isready -U aprovizionare -d aprovizionare"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"  # interfața web pentru citirea emailurilor
      # Serverul SMTP: primește emailurile aplicației (și ale celei pornite din Python,
      # pe calculatorul dezvoltatorului), dar nu le trimite mai departe nimănui.
      - "127.0.0.1:1025:1025"

  web:
    build: .
    image: ruris-aprovizionare:local
    ports:
      - "8000:8000"
    environment: &app-environment  # „&” = definim setările o dată și le refolosim mai jos
      SECRET_KEY: cheie-doar-pentru-docker-local-nu-pentru-productie
      DEBUG: "False"
      USE_HTTPS: "False"  # local rulăm pe http://localhost
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://aprovizionare:aprovizionare@db:5432/aprovizionare
      EMAIL_URL: smtp://mailpit:1025
      SITE_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy  # pornește abia după ce baza de date e gata
      mailpit:
        condition: service_started

  scheduler:
    image: ruris-aprovizionare:local  # aceeași imagine ca aplicația, altă comandă
    build: .
    entrypoint: []  # migrațiile le aplică serviciul web; planificatorul le așteaptă
    command: ["python", "manage.py", "run_scheduler"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped  # dacă se oprește neașteptat, Docker îl repornește

volumes:
  pgdata:
